<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卒業生アンケート</title><style>
:root{--n:#174a73;--l:#d8e2e9;--t:#1d2a33;--m:#61717c}*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;line-height:1.55}main{width:min(100%,640px);min-height:100vh;margin:auto;padding:24px 16px 40px;background:#fff}h1{font-size:1.45rem;margin:0 0 6px}.lead,.help,.note,.privacy{color:var(--m);font-size:.88rem}.tabs{display:flex;gap:8px;margin:0 0 20px}.tab,.primary,.secondary{min-height:48px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.tab{flex:1;border:1px solid var(--l);background:#fff}.tab[aria-selected=true],.primary{background:var(--n);border-color:var(--n);color:#fff}.question{margin:0 0 20px;padding:16px;border:1px solid var(--l);border-radius:12px}legend{font-weight:700}.required,.error{color:#b42318}.options{display:grid;gap:9px;margin-top:12px}.choice{display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 10px;border:1px solid var(--l);border-radius:8px;cursor:pointer}input{width:20px;height:20px;accent-color:var(--n)}.free{width:100%;min-height:44px;margin-top:8px;padding:10px;border:1px solid var(--l);border-radius:8px;font:inherit}.area{min-height:88px;resize:vertical}.primary,.secondary{width:100%;border:0;padding:10px 14px}.primary:disabled{background:#91a4b2}.secondary{margin-top:12px;background:#eef3f6}.error{min-height:1.5em;font-weight:700}.hidden{display:none!important}.thanks{text-align:center;padding-top:40px}.review{margin:20px 0 8px;padding:16px;border:1px solid #b9d8ef;border-radius:10px;background:#eaf5ff;text-align:left;white-space:pre-wrap}@media(max-width:380px){.tabs{display:grid}}
</style></head><body><main>
<section id="formView"><h1>卒業生アンケート</h1><p class="lead">ご回答ありがとうございます。約1分で完了します。</p><div id="tabs" class="tabs" role="tablist" aria-label="卒業した学校"></div><form id="form" novalidate><div id="questions"></div><button id="send" class="primary">アンケートを送信する</button><p id="error" class="error" role="alert"></p></form><p class="privacy">個人を特定する情報は入力しないでください。回答はサービス改善のために利用します。</p></section>
<section id="thanks" class="thanks hidden"><h2>ご回答ありがとうございました</h2><p>よろしければ、下の文章を口コミとしてご投稿ください。</p><textarea id="review" class="review free area" aria-label="口コミ文（編集できます）"></textarea><button id="google" class="primary">文章をコピーしてGoogleを開く</button><p class="note">※枠内を長押しして「貼り付け」をしてご投稿ください。文章は必要に応じて修正できます。</p><button id="close" class="secondary">閉じる</button></section>
</main><script type="module">
/* ===== 公開前に値を差し替える設定 ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyDNbCCmEIR7sRRSILivVWXAK5TN5Vsxe2M",authDomain:"review-survey.firebaseapp.com",projectId:"review-survey",storageBucket:"review-survey.firebasestorage.app",messagingSenderId:"791019332769",appId:"1:791019332769:web:2424ce306f745136e73ce0"};
const REVIEW_URLS={fashion:"https://g.page/r/Cfr3aO08e7JNEBM/review",pet:"https://g.page/r/PET_XXXXX/review"};
/* 質問の追加・変更・削除は、下のSURVEY_DATAで行います。review:trueだけが口コミ文に使われます。 */
const COMMON=[
 {id:"purpose",type:"checkbox",title:"3. 本日は何のための訪問ですか？",required:true,review:false,options:["先生・職員に会いに来た","同級生・後輩に会いに来た","イベント・学校行事への参加","証明書などの手続き","勤務先からの求人・連携の相談"],free:{label:"その他（任意）",placeholder:"例：見学、打ち合わせ など"}},
 {id:"rating",type:"rating",title:"4. 本日の満足度",required:true,review:false,options:[{label:"★★★★★（大変満足）",value:5},{label:"★★★★☆（満足）",value:4},{label:"★★★☆☆（普通）",value:3},{label:"★★☆☆☆（やや不満）",value:2},{label:"★☆☆☆☆（不満）",value:1}]},
 {id:"impression",type:"checkbox",title:"5. 印象に残ったこと",required:true,review:true,options:[{label:"先生・職員の温かい対応",text:"先生や職員の皆さんが温かく迎えてくださいました"},{label:"在校生の雰囲気",text:"在校生の皆さんがいきいきとしていました"},{label:"校舎・施設の変化",text:"校舎や施設がきれいに整っていました"},{label:"学校の活気",text:"学校に活気を感じました"}],free:{label:"その他、印象に残ったこと（任意）",placeholder:"自由に入力してください",area:true,review:true}},
 {id:"message",type:"radio",title:"6. 一言メッセージ",required:false,review:true,options:[{label:"また訪れたい",text:"また訪れたいと思いました"},{label:"これからも応援している",text:"これからも応援しています"},{label:"後輩に勧めたい",text:"後輩にも勧めたい学校です"}],free:{label:"自由メッセージ（任意）",placeholder:"自由に入力してください",area:true,review:true}}
];
const department=(list)=>({id:"department",type:"radio",title:"2. 在籍していた学科はどちらですか？",required:false,review:false,options:[...list,"その他"],free:{label:"その他の学科名（任意）",placeholder:"学科名を入力してください"}});
const SURVEY_DATA={
 fashion:{tab:"国際ファッション\nビューティ専門学校",questions:[department(["ファッション学科","ブライダルスペシャリスト学科","エステティックビューティ学科","メイク・ネイル学科"]),...COMMON]},
 pet:{tab:"国際ペット\n総合専門学校",questions:[department(["トリマー学科","ドッグトレーナー＆アニマルケア学科","動物看護師学科","ペット総合学科"]),...COMMON.map(q=>q.id!=="impression"?q:{...q,options:[...q.options.slice(0,3),{label:"動物や実習環境",text:"動物や実習環境が整っていました"}]})]}
};
const PARTS={open:["久しぶりに母校を訪問しました。","本日、卒業生として学校を訪れました。","来校の機会をいただきました。","母校を訪れる機会がありました。","久しぶりの来校でした。","本日、学校に伺いました。","卒業以来、久しぶりに訪問しました。","来校させていただきました。"],join:["。また、","。さらに、","。そして、","。あわせて、","。特に、"],close:["訪問できて良かったです！","温かいご対応をありがとうございました。","これからも応援しています。","懐かしく、うれしい時間になりました。","また伺いたいと思いました。","丁寧に対応していただき、ありがとうございました。","今後のますますのご発展をお祈りしています。","母校の雰囲気に触れられて良かったです。"]};
/* ===== 設定はここまで ===== */
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,addDoc,collection,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id),esc=v=>{let e=document.createElement("div");e.textContent=v;return e.innerHTML};let school="fashion",db,reviewText="";if(!Object.values(FIREBASE_CONFIG).some(x=>x.includes("YOUR_")))try{db=getFirestore(initializeApp(FIREBASE_CONFIG))}catch(e){console.warn(e)}
function tabs(){$("tabs").innerHTML=Object.entries(SURVEY_DATA).map(([id,x])=>`<button class="tab" type="button" aria-selected="${id===school}" data-school="${id}">${esc(x.tab).replace("\n","<br>")}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{school=b.dataset.school;render()})}
function render(){tabs();$("error").textContent="";$("questions").innerHTML=SURVEY_DATA[school].questions.map(q=>{let type=q.type==="checkbox"?"checkbox":"radio";let o=q.options.map((x,i)=>{let v=typeof x==="string"?{label:x,value:x}:x;return `<label class="choice"><input name="${q.id}" type="${type}" value="${esc(v.value??v.label)}" data-text="${esc(v.text??"")}"><span>${esc(v.label)}</span></label>`}).join("");let f=q.free?`<label class="help">${esc(q.free.label)}</label>${q.free.area?`<textarea id="${q.id}_free" class="free area" placeholder="${esc(q.free.placeholder)}"></textarea>`:`<input id="${q.id}_free" class="free" placeholder="${esc(q.free.placeholder)}">`}`:"";return`<fieldset class="question"><legend>${esc(q.title)}${q.required?' <span class="required">必須</span>':""}</legend><div class="options">${o}</div>${f}</fieldset>`}).join("")}
function gather(){let answers={},texts=[],missing="";SURVEY_DATA[school].questions.forEach(q=>{let c=[...document.querySelectorAll(`[name="${q.id}"]:checked`)],f=$(q.id+"_free")?.value.trim()||"";if(q.required&&!c.length&&!f)missing=q.title;answers[q.id]={choices:c.map(x=>({value:x.value,text:x.dataset.text})),freeText:f};if(q.review){c.forEach(x=>x.dataset.text&&texts.push(x.dataset.text));if(q.free?.review&&f)texts.push(f)}});return{answers,texts,missing}}
const pick=x=>x[Math.floor(Math.random()*x.length)],shuffle=x=>[...x].sort(()=>Math.random()-.5);function review(t){const b=shuffle([...new Set(t)]),body=b.length?b.join(pick(PARTS.join))+"。":"今回の訪問について、感じたことを投稿します。";return `${pick(PARTS.open)}\n${body}\n${pick(PARTS.close)}`}
$("form").onsubmit=async e=>{e.preventDefault();let r=gather();if(r.missing){$("error").textContent=`「${r.missing}」を選択または入力してください。`;return}$("send").disabled=true;$("send").textContent="送信しています…";try{if(db)await addDoc(collection(db,"graduateSurveyResponses"),{school,answers:r.answers,createdAt:serverTimestamp()})}catch(err){$("error").textContent="送信できませんでした。電波状況を確認して、もう一度お試しください。";$("send").disabled=false;$("send").textContent="アンケートを送信する";return}reviewText=review(r.texts);$("review").value=reviewText;$("formView").classList.add("hidden");$("thanks").classList.remove("hidden")};
$("google").onclick=async()=>{reviewText=$("review").value.trim();try{await navigator.clipboard.writeText(reviewText)}catch{let a=document.createElement("textarea");a.value=reviewText;document.body.append(a);a.select();document.execCommand("copy");a.remove()}alert("文章をコピーしました！");window.open(REVIEW_URLS[school],"_blank","noopener")};$("close").onclick=()=>$("thanks").innerHTML="<h2>ありがとうございました</h2><p>またのご来校をお待ちしております。</p>";render();
</script></body></html>
