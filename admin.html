<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アンケート管理</title><style>
body{max-width:900px;margin:auto;padding:20px;font-family:system-ui,sans-serif;color:#18242d;background:#f7fafc}button,input,textarea,select{font:inherit;padding:10px}button{background:#174a73;color:#fff;border:0;border-radius:7px;cursor:pointer}button.sub{background:#e8f0f5;color:#18242d}section,.card{background:#fff;border:1px solid #d8e2e9;border-radius:10px;padding:16px;margin:16px 0}.hidden{display:none}label{display:block;margin-top:10px;font-weight:700}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid #b8c6d0;border-radius:6px}.nav{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#61717c;font-size:.9em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.option{display:flex;gap:8px;margin:6px 0}.option input{flex:1}.option button{background:#fff;color:#a22;border:1px solid #d8e2e9}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row label{font-weight:400}.question{border-left:5px solid #174a73}.question h3{margin:0}.question textarea{min-height:65px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style><body><h1>アンケート管理</h1><p id="state">Googleアカウントでログインしてください。</p><button id="login">Googleでログイン</button><button id="logout" class="hidden">ログアウト</button>
<main id="app" class="hidden"><div class="nav"><button data-page="dash">ダッシュボード</button><button data-page="settings">設定</button></div>
<section id="dash"><h2>ダッシュボード</h2><label>学校<select id="dashSchool"></select></label><div class="grid"><div class="card">回答数<br><strong id="count">0</strong></div><div class="card">平均満足度<br><strong id="average">—</strong></div></div><button id="csv">CSVを出力</button><div id="answers"></div></section>
<section id="settings" class="hidden"><h2>設定</h2><label>学校<select id="editSchool"></select></label><label>タブ表示名<input id="tab"></label><label>Google口コミリンク<input id="reviewUrl" placeholder="https://g.page/r/.../review"></label><h2>質問</h2><p class="muted">質問文・選択肢を直接編集できます。削除した質問は新規回答に表示されなくなります。</p><div id="questionList"></div><button id="addQuestion" class="sub">＋ 質問を追加</button><div class="row" style="margin-top:16px"><button id="save">公開する</button><button id="preview" class="sub">利用者画面を確認</button></div></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,doc,getDoc,getDocs,collection,query,where,updateDoc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg={apiKey:'AIzaSyDNbCCmEIR7sRRSILivVWXAK5TN5Vsxe2M',authDomain:'review-survey.firebaseapp.com',projectId:'review-survey',storageBucket:'review-survey.firebasestorage.app',messagingSenderId:'791019332769',appId:'1:791019332769:web:2424ce306f745136e73ce0'};const $=x=>document.getElementById(x),db=getFirestore(initializeApp(cfg)),auth=getAuth(),provider=new GoogleAuthProvider();let role,schools={};
function show(p){$('dash').classList.toggle('hidden',p!=='dash');$('settings').classList.toggle('hidden',p!=='settings')}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));
function optionRow(value=''){const d=document.createElement('div');d.className='option';d.innerHTML=`<input value="${String(value).replaceAll('&','&amp;').replaceAll('"','&quot;')}" placeholder="選択肢"><button type="button">削除</button>`;d.querySelector('button').onclick=()=>d.remove();return d}
function card(q={id:`q_${Date.now()}`,type:'radio',title:'新しい質問',required:false,review:false,options:['選択肢 1','選択肢 2']}){const d=document.createElement('article');d.className='card question';d.dataset.id=q.id;d.innerHTML=`<div class="row"><h3>質問</h3><button type="button" class="sub delete">この質問を削除</button></div><label>質問文<input class="title" value="${q.title}"></label><label>回答形式<select class="type"><option value="radio">1つ選ぶ</option><option value="checkbox">複数選ぶ</option><option value="rating">星評価</option><option value="text">自由記入のみ</option></select></label><div class="row"><label><input class="required" type="checkbox"> 必須にする</label><label class="freeFlagBox"><input class="freeFlag" type="checkbox"> その他・自由記入欄を付ける</label><label><input class="review" type="checkbox"> 口コミ文に使う</label></div><div class="freeConfig"><label>自由記入欄の見出し<input class="freeLabel"></label></div><div class="choices"><label>選択肢</label><div class="optionList"></div><button type="button" class="sub addOpt">＋ 選択肢を追加</button></div>`;d.querySelector('.type').value=q.type;d.querySelector('.required').checked=!!q.required;d.querySelector('.review').checked=!!q.review;d.querySelector('.freeFlag').checked=!!q.free;d.querySelector('.freeLabel').value=q.free?.label||'その他・自由記入（任意）';const list=d.querySelector('.optionList');(q.options||[]).forEach(o=>list.append(optionRow(typeof o==='string'?o:o.label)));d.querySelector('.addOpt').onclick=()=>list.append(optionRow());d.querySelector('.delete').onclick=()=>d.remove();const change=()=>{const text=d.querySelector('.type').value==='text';d.querySelector('.choices').classList.toggle('hidden',['rating','text'].includes(d.querySelector('.type').value));d.querySelector('.freeFlagBox').classList.toggle('hidden',text);d.querySelector('.freeConfig').classList.toggle('hidden',!text&&!d.querySelector('.freeFlag').checked)};d.querySelector('.type').onchange=change;d.querySelector('.freeFlag').onchange=change;change();return d}
function render(){const s=schools[$('editSchool').value];$('tab').value=s.tab;$('reviewUrl').value=s.reviewUrl||'';const list=$('questionList');list.innerHTML='';s.questions.forEach(q=>{const c=card(q);c.dataset.free=JSON.stringify(q.free||null);list.append(c)})}
function readQuestions(){return[...document.querySelectorAll('.question')].map((d,i)=>{const type=d.querySelector('.type').value,title=d.querySelector('.title').value.trim(),options=[...d.querySelectorAll('.option input')].map(x=>x.value.trim()).filter(Boolean),review=d.querySelector('.review').checked;const q={id:d.dataset.id||`q_${Date.now()}_${i}`,type,title,required:d.querySelector('.required').checked,review};if(type==='rating')q.options=[5,4,3,2,1].map(n=>({label:'★'.repeat(n)+'☆'.repeat(5-n),value:n}));else if(type==='text')q.options=[];else q.options=options.map(label=>review?{label,text:label}:{label,value:label});if(type==='text'||d.querySelector('.freeFlag').checked)q.free={label:d.querySelector('.freeLabel').value.trim()||'自由記入',placeholder:'自由に入力してください',area:true,review};return q})}
const safe=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function answerCard(row,school){const date=row.createdAt?.toDate?row.createdAt.toDate().toLocaleString('ja-JP'):'日時なし';const lines=(school.questions||[]).map(q=>{const a=row.answers?.[q.id],labels=(a?.choices||[]).map(c=>{const found=(q.options||[]).find(o=>(typeof o==='string'?o:o.value??o.label)===c.value);return typeof found==='string'?found:(found?.label||c.value)});if(a?.freeText)labels.push(a.freeText);return labels.length?`<p><strong>${safe(q.title)}</strong><br>${labels.map(safe).join('、')}</p>`:''}).join('');return `<article class="card"><p class="muted">${safe(date)}</p>${lines||'<p>回答内容を表示できません。</p>'}</article>`}
async function dashboard(){const id=$('dashSchool').value,snap=await getDocs(query(collection(db,'graduateSurveyResponses'),where('school','==',id)));let a=[],rows=[];snap.forEach(x=>{let d=x.data(),r=d.answers?.rating?.choices?.[0]?.value;if(r)a.push(+r);rows.push(d)});$('count').textContent=rows.length;$('average').textContent=a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'—';$('answers').innerHTML=rows.length?`<h2>最新の回答</h2>${rows.slice(-20).reverse().map(r=>answerCard(r,schools[id])).join('')}`:'<p>回答はまだありません。</p>';window.rows=rows}
async function load(){const ix=await getDoc(doc(db,'system','surveyIndex'));if(!ix.exists()){ $('state').textContent='初期設定がありません。Firestoreの初期設定を完了してください。';return}for(const id of ix.data().schoolIds||[]){const s=await getDoc(doc(db,'surveys',id));if(s.exists())schools[id]=s.data()}const ids=role.role==='owner'?Object.keys(schools):role.schoolIds.filter(x=>schools[x]);for(const id of ids){$('dashSchool').insertAdjacentHTML('beforeend',`<option value="${id}">${schools[id].tab}</option>`);$('editSchool').insertAdjacentHTML('beforeend',`<option value="${id}">${schools[id].tab}</option>`)}render();dashboard()}
$('login').onclick=()=>signInWithPopup(auth,provider);$('logout').onclick=()=>signOut(auth);$('editSchool').onchange=render;$('dashSchool').onchange=dashboard;$('addQuestion').onclick=()=>$('questionList').append(card());$('preview').onclick=()=>window.open('./','_blank');$('save').onclick=async()=>{const id=$('editSchool').value;await updateDoc(doc(db,'surveys',id),{tab:$('tab').value.trim(),reviewUrl:$('reviewUrl').value.trim(),questions:readQuestions()});schools[id].tab=$('tab').value.trim();schools[id].reviewUrl=$('reviewUrl').value.trim();schools[id].questions=readQuestions();alert('公開しました。利用者画面を再読み込みして確認してください。')};$('csv').onclick=()=>{const text='school,answers\n'+(window.rows||[]).map(x=>`${x.school},"${JSON.stringify(x.answers).replaceAll('"','""')}"`).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='answers.csv';a.click()};onAuthStateChanged(auth,async u=>{if(!u)return;const r=await getDoc(doc(db,'adminUsers',u.uid));if(!r.exists()){$('state').textContent='このGoogleアカウントは管理者登録されていません。';return}role=r.data();$('state').textContent=`${u.email} としてログイン中`;$('login').classList.add('hidden');$('logout').classList.remove('hidden');$('app').classList.remove('hidden');load()});
</script></body></html>
