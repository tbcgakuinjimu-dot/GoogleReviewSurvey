<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アンケート管理</title><style>body{max-width:860px;margin:auto;padding:24px;font-family:system-ui,sans-serif;color:#18242d}button,input,textarea,select{font:inherit;padding:10px}button{background:#174a73;color:#fff;border:0;border-radius:6px;cursor:pointer}section{border:1px solid #d8e2e9;border-radius:10px;padding:16px;margin:16px 0}.hidden{display:none}label{display:block;margin-top:10px;font-weight:700}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid #b8c6d0;border-radius:6px}textarea{min-height:160px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#61717c;font-size:.9em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style>
<body><h1>アンケート管理</h1><p id="state">Googleアカウントでログインしてください。</p><button id="login">Googleでログイン</button><button id="initialize" class="hidden">初期設定を作成する</button><button id="logout" class="hidden">ログアウト</button>
<main id="app" class="hidden"><div class="tabs"><button data-page="dash">ダッシュボード</button><button data-page="settings">設定</button></div>
<section id="dash"><h2>ダッシュボード</h2><label>学校<select id="dashSchool"></select></label><div class="grid"><p>回答数<br><strong id="count">0</strong></p><p>平均満足度<br><strong id="average">—</strong></p><p>期間<br><strong>全期間</strong></p></div><button id="csv">CSVを出力</button><div id="answers"></div></section>
<section id="settings" class="hidden"><h2>設定</h2><p class="muted">学校名・口コミリンク・質問を編集し、「公開」を押すと利用者画面へ反映します。</p><label>学校<select id="editSchool"></select></label><label>タブ表示名<input id="tab"></label><label>Google口コミリンク<input id="reviewUrl"></label><label>質問設定（編集用データ）<textarea id="questions"></textarea></label><button id="save">公開する</button><p class="muted">質問データは、既存の質問をそのまま表示します。質問IDは意味を変えない限り変更しないでください。</p></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,doc,getDoc,getDocs,collection,query,where,setDoc,updateDoc,writeBatch}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const cfg={apiKey:'AIzaSyDNbCCmEIR7sRRSILivVWXAK5TN5Vsxe2M',authDomain:'review-survey.firebaseapp.com',projectId:'review-survey',storageBucket:'review-survey.firebasestorage.app',messagingSenderId:'791019332769',appId:'1:791019332769:web:2424ce306f745136e73ce0'};const $=x=>document.getElementById(x),db=getFirestore(initializeApp(cfg)),auth=getAuth(),provider=new GoogleAuthProvider();let me,role,schools={};
const template=(tab,departments)=>({tab,reviewUrl:'',questions:[{id:'department',type:'radio',title:'2. 在籍していた学科はどちらですか？',required:false,review:false,options:[...departments,'その他'],free:{label:'その他の学科名（任意）',placeholder:'学科名を入力してください'}},{id:'purpose',type:'checkbox',title:'3. 本日は何のための訪問ですか？',required:true,review:false,options:['先生・職員に会いに来た','同級生・後輩に会いに来た','イベント・学校行事への参加','証明書などの手続き']},{id:'rating',type:'rating',title:'4. 本日の満足度',required:true,review:false,options:[{label:'★★★★★（大変満足）',value:5},{label:'★★★★☆（満足）',value:4},{label:'★★★☆☆（普通）',value:3},{label:'★★☆☆☆（やや不満）',value:2},{label:'★☆☆☆☆（不満）',value:1}]},{id:'impression',type:'checkbox',title:'5. 印象に残ったこと',required:true,review:true,options:[{label:'先生・職員の温かい対応',text:'先生や職員の皆さんが温かく迎えてくださいました'},{label:'在校生の雰囲気',text:'在校生の皆さんがいきいきとしていました'},{label:'校舎・施設の変化',text:'校舎や施設がきれいに整っていました'}],free:{label:'その他、印象に残ったこと（任意）',placeholder:'自由に入力してください',area:true,review:true}},{id:'message',type:'radio',title:'6. 一言メッセージ',required:false,review:true,options:[{label:'また訪れたい',text:'また訪れたいと思いました'},{label:'これからも応援している',text:'これからも応援しています'}],free:{label:'自由メッセージ（任意）',placeholder:'自由に入力してください',area:true,review:true}}]});
const esc=x=>{let d=document.createElement('div');d.textContent=x;return d.innerHTML};function showPage(p){$('dash').classList.toggle('hidden',p!=='dash');$('settings').classList.toggle('hidden',p!=='settings')}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
async function load(){const index=await getDoc(doc(db,'system','surveyIndex'));if(!index.exists()){ $('state').textContent='初回設定がまだです。下の「初期設定を作成する」を1回押してください。';if(role.role==='owner')$('initialize').classList.remove('hidden');return }for(const id of index.data().schoolIds||[]){const d=await getDoc(doc(db,'surveys',id));if(d.exists())schools[id]=d.data()}if(!Object.keys(schools).length){$('state').textContent='学校設定がまだです。下の「初期設定を作成する」を1回押してください。';if(role.role==='owner')$('initialize').classList.remove('hidden');return}const allowed=role.role==='owner'?Object.keys(schools):role.schoolIds;for(const id of allowed){$('dashSchool').insertAdjacentHTML('beforeend',`<option value="${esc(id)}">${esc(schools[id].tab)}</option>`);$('editSchool').insertAdjacentHTML('beforeend',`<option value="${esc(id)}">${esc(schools[id].tab)}</option>`)}edit();dashboard()}
function edit(){const s=schools[$('editSchool').value];if(!s)return;$('tab').value=s.tab;$('reviewUrl').value=s.reviewUrl||'';$('questions').value=JSON.stringify(s.questions,null,2)}async function dashboard(){const id=$('dashSchool').value,s=schools[id];const snap=await getDocs(query(collection(db,'graduateSurveyResponses'),where('school','==',id)));let ratings=[];const rows=[];snap.forEach(d=>{const x=d.data();const r=x.answers?.rating?.choices?.[0]?.value;if(r)ratings.push(Number(r));rows.push(x)});$('count').textContent=rows.length;$('average').textContent=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1):'—';$('answers').innerHTML=rows.slice(-20).reverse().map(x=>`<p>${esc(JSON.stringify(x.answers))}</p>`).join('')||'<p>回答はまだありません。</p>';window.rows=rows}
$('login').onclick=()=>signInWithPopup(auth,provider);$('logout').onclick=()=>signOut(auth);$('editSchool').onchange=edit;$('dashSchool').onchange=dashboard;$('save').onclick=async()=>{const id=$('editSchool').value;try{const questions=JSON.parse($('questions').value);await updateDoc(doc(db,'surveys',id),{tab:$('tab').value,reviewUrl:$('reviewUrl').value,questions});alert('公開しました。')}catch(e){alert('保存できません。質問データの形式を確認してください。')}};$('csv').onclick=()=>{const rows=window.rows||[];const text='school,answers\n'+rows.map(x=>`${x.school},"${JSON.stringify(x.answers).replaceAll('"','""')}"`).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='answers.csv';a.click()};onAuthStateChanged(auth,async u=>{if(!u){$('app').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');return}me=u;const r=await getDoc(doc(db,'adminUsers',u.uid));if(!r.exists()){$('state').textContent=`このアカウント（UID: ${u.uid}）は管理者登録されていません。`;return}role=r.data();$('state').textContent=`${u.email} としてログイン中`; $('app').classList.remove('hidden');$('login').classList.add('hidden');$('logout').classList.remove('hidden');load()});
$('initialize').onclick=async()=>{if(!confirm('2校分の初期設定を作成します。よろしいですか？'))return;const b=writeBatch(db);b.set(doc(db,'system','surveyIndex'),{schoolIds:['fashion','pet'],reviewParts:{open:['久しぶりに母校を訪問しました。','本日、卒業生として学校を訪れました。'],join:['。また、','。そして、'],close:['訪問できて良かったです！','温かいご対応をありがとうございました。']}});b.set(doc(db,'surveys','fashion'),template('国際ファッションビューティ専門学校',['ファッション学科','ブライダルスペシャリスト学科','エステティックビューティ学科','メイク・ネイル学科']));b.set(doc(db,'surveys','pet'),template('国際ペット総合専門学校',['トリマー学科','ドッグトレーナー＆アニマルケア学科','動物看護師学科','ペット総合学科']));await b.commit();location.reload()};
</script></body></html>
